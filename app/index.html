<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Sunset Cover Studio</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="studio">
  <header class="topbar">
    <h1>Neon Sunset Cover Studio</h1>
    <p>GTA-style cover maker. Photos stay on your machine, nothing is uploaded.</p>
  </header>
  <section class="controls" id="controls">
    <div class="group">
      <h2>1. Photos</h2>
      <label class="file-label">Upload photo(s)
        <input id="photo" type="file" accept="image/*" multiple>
      </label>
      <div class="row">
        <button id="sample-boulevard" type="button">Load sample: Boulevard</button>
        <button id="sample-pier" type="button">Load sample: Pier</button>
      </div>
      <button id="fill-all" type="button" aria-pressed="false">One photo fills all panels</button>
      <p class="hint" id="photo-count">No photo yet. Load a sample or upload your own.</p>
    </div>
    <div class="group">
      <h2>2. Layout</h2>
      <div class="row" id="layouts"></div>
    </div>
    <div class="group">
      <h2>3. Colour grade</h2>
      <div class="row" id="grades"></div>
    </div>
    <div class="group">
      <h2>4. Lettering</h2>
      <label>Caption
        <input id="caption" type="text" maxlength="40" value="VICE CITY NIGHTS">
      </label>
      <label>Subtitle
        <input id="subtitle" type="text" maxlength="40" value="chase the sunset">
      </label>
      <label class="check"><input id="gradient-caption" type="checkbox" checked> Sunset gradient caption</label>
    </div>
    <div class="group">
      <h2>5. Panel &amp; effects</h2>
      <label>Selected panel
        <select id="panel-select"></select>
      </label>
      <label>Zoom <span id="zoom-value">1.00x</span>
        <input id="zoom" type="range" min="1" max="3" step="0.05" value="1">
      </label>
      <p class="hint">Drag a panel on the preview to reposition its photo.</p>
      <label class="check"><input id="grain" type="checkbox" checked> Film grain</label>
      <label class="check"><input id="vignette" type="checkbox" checked> Vignette</label>
    </div>
    <div class="group">
      <h2>6. Export</h2>
      <label>Size
        <select id="export-size">
          <option value="1080x1080">1080 x 1080 (square)</option>
          <option value="1080x1350">1080 x 1350 (portrait)</option>
          <option value="1920x1080">1920 x 1080 (landscape)</option>
        </select>
      </label>
      <button id="export" type="button" class="primary">Export PNG</button>
      <p id="status" role="status"></p>
      <p id="selftest-result" role="status"></p>
    </div>
  </section>
  <section class="stage">
    <canvas id="preview" width="1080" height="1080" aria-label="Live cover preview"></canvas>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
